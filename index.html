<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PWA Localitzacions</title>

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header>
    <img src="logppc.png" alt="Logo PPC" class="logo">
    <h1>Localitzacions</h1>
  </header>

  <main>
    <input id="buscador" type="text" placeholder="Escriu per buscar..." autocomplete="off">

    <div id="resultats"></div>

    <div id="detall" class="ocult">
      <h2 id="detall-nom"></h2>

      <p><strong>Latitud:</strong> <span id="detall-lat"></span></p>
      <p><strong>Longitud:</strong> <span id="detall-lon"></span></p>
      <p><strong>Població:</strong> <span id="detall-poblacio"></span></p>
      <p><strong>Comarca:</strong> <span id="detall-comarca"></span></p>
      <p><strong>Telèfon:</strong> <span id="detall-telefon"></span></p>
      <p><strong>Comentari:</strong> <span id="detall-comentari"></span></p>

      <div id="gps-buttons"></div>

      <button id="tancar-detall">Tancar</button>

      <button id="installBtn" class="ocult">Instal·lar App</button>
    </div>
  </main>

  <script type="module" src="app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js');
    }
  </script>

</body>
</html>
